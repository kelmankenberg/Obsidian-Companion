name: Bug report
description: Report a problem with Obsidian Companion.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove private notes, vault paths, credentials, and
        other sensitive information from screenshots and logs before sharing.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Obsidian Companion
        2. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Obsidian Companion version
      description: Find this in the Companion panel header.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Omarchy and Obsidian versions
      description: Include the versions if known.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add redacted screenshots or logs if helpful.
